<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AuroraStays QnA: interface demo with sample data</title>
<meta name="description" content="Static demo of the AuroraStays QnA interface. The questions and answers on this page are fixed samples.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F8F7;--surface:#FFFFFF;--surface2:#F0F2F0;--hover:#E9EDEA;--border:#E3E8E4;--text:#202722;--muted:#5F6962;--faint:#626C65;
 --accent:#287A5B;--accent-hover:#20674C;--accent-soft:#E7F2EC;--on-accent:#FFFFFF;
 --ok-fg:#1F6B4E;--ok-bg:#E7F2EC;--warn-fg:#875810;--warn-bg:#F8F0DF;--bad-fg:#AD3D3D;--bad-bg:#F9EAEA;
 --shadow:0 1px 2px rgba(20,30,24,.04),0 4px 16px rgba(20,30,24,.04);
 --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
 --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--ease:cubic-bezier(.2,.8,.2,1)}
[data-theme="dark"]{--bg:#111512;--surface:#191F1B;--surface2:#202823;--hover:#29332C;--border:#29332D;--text:#EEF2EE;--muted:#A3ADA5;--faint:#96A199;
 --accent:#72BD96;--accent-hover:#8ACBA8;--accent-soft:#1D382A;--on-accent:#0E1711;
 --ok-fg:#72BD96;--ok-bg:#1D382A;--warn-fg:#E6B968;--warn-bg:#40331D;--bad-fg:#F18A85;--bad-bg:#402523;--shadow:0 1px 3px rgba(0,0,0,.3)}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
button{font-family:inherit;color:inherit;cursor:pointer}
.notice{background:var(--warn-bg);color:var(--text);font-size:13px;line-height:1.45;padding:8px 16px;text-align:center}
.notice b{color:var(--warn-fg)}
.app{display:flex;min-height:calc(100vh - 37px)}
.side{width:264px;flex:0 0 264px;border-right:1px solid var(--border);padding:16px 14px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600;letter-spacing:-.02em;padding:2px 4px 6px}
.brand i{font-style:normal;font-weight:500;color:var(--faint)}
.primary{background:var(--accent);color:var(--on-accent);border:0;border-radius:10px;min-height:36px;font-size:13px;font-weight:500;transition:background .18s var(--ease)}
.primary:hover{background:var(--accent-hover)}
.search{width:100%;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:10px;padding:8px 12px;font:inherit;font-size:13px}
.search::placeholder{color:var(--faint)}
.group{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);padding:14px 6px 6px;line-height:1.2}
.row{display:grid;grid-template-columns:16px minmax(0,1fr);align-items:center;row-gap:1px;width:100%;text-align:left;border:0;background:transparent;
 border-radius:10px;padding:7px 8px;transition:background .18s var(--ease)}
.row:hover,.row.on{background:var(--hover)}
.row .dot{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.row.auto .dot{background:var(--ok-fg)}.row.review .dot{background:var(--warn-fg)}.row.manual .dot{background:var(--bad-fg)}
.row .q{font-size:13px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.row.on .q{font-weight:600}
.row .t{grid-column:2;font-family:var(--mono);font-size:10.5px;color:var(--faint);line-height:1.3}
.none{font-size:13px;color:var(--muted);margin:10px 6px}
.health{font-size:12px;color:var(--muted);margin-top:auto;padding:8px 6px 0}
.health span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn-fg);margin-right:7px;vertical-align:middle}
.main{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.top{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;gap:8px}
.ghost{background:transparent;border:1px solid transparent;border-radius:10px;min-height:34px;padding:4px 10px;font-size:13px;font-weight:500;transition:background .18s var(--ease)}
.ghost:hover{background:var(--hover)}
.menu{display:none}
.col{width:100%;max-width:792px;margin:0 auto;padding:0 24px 24px;flex:1 1 auto}
.hero{text-align:center;padding:28px 8px 8px}
.hero h1{font-size:clamp(24px,5vw,32px);font-weight:600;letter-spacing:-.035em;line-height:1.25;margin:18px 0 6px}
.hero p{color:var(--muted);font-size:15px;line-height:1.6;max-width:30rem;margin:0 auto}
.try{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);text-align:center;margin:28px 0 8px}
.examples{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.examples button{background:var(--surface);border:1px solid transparent;border-radius:12px;padding:10px 14px;box-shadow:var(--shadow);text-align:left;
 font-size:13px;line-height:1.45;transition:border-color .18s var(--ease)}
.examples button:hover{border-color:var(--accent)}
.bubble{display:flex;flex-direction:column;align-items:flex-end;margin:14px 0 2px}
.bubble div{background:var(--surface2);border-radius:16px 16px 4px 16px;padding:9px 14px;max-width:85%;font-size:15px;line-height:1.55}
.bubble span{font-family:var(--mono);font-size:10.5px;color:var(--faint);margin:4px 6px 0}
.card{background:var(--surface);border-radius:16px;padding:20px 22px 14px;box-shadow:var(--shadow);margin:6px 0 10px;animation:in .2s var(--ease)}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin:0 0 10px}
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;font-weight:700;letter-spacing:.04em;font-size:10.5px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.ok{color:var(--ok-fg);background:var(--ok-bg)}.warn{color:var(--warn-fg);background:var(--warn-bg)}.bad{color:var(--bad-fg);background:var(--bad-bg)}
.hint{color:var(--muted);font-size:12.5px}
.stat{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--faint);white-space:nowrap}
.answer{font-size:15px;line-height:1.7;margin:0 0 8px}
sup.cite{display:inline-block;min-width:16px;padding:0 4px;margin:0 1px;border-radius:5px;background:var(--accent-soft);color:var(--accent);
 font-family:var(--mono);font-size:10.5px;font-weight:500;line-height:16px;text-align:center;vertical-align:.3em}
details{margin:2px 0}
summary{list-style:none;cursor:pointer;color:var(--muted);font-size:13px;padding:6px 8px;border-radius:8px;transition:background .18s var(--ease)}
summary::-webkit-details-marker{display:none}
summary::before{content:"\203A";display:inline-block;margin-right:8px;transition:transform .18s var(--ease)}
details[open] summary::before{transform:rotate(90deg)}
summary:hover{background:var(--hover)}
.src{background:var(--surface2);border-radius:12px;padding:12px 14px;margin:6px 0 8px}
.src-h{display:flex;gap:10px;align-items:flex-start}
.src-n{flex:0 0 auto;min-width:20px;height:20px;border-radius:6px;background:var(--accent-soft);color:var(--accent);font-family:var(--mono);font-size:11px;line-height:20px;text-align:center}
.src-doc{flex:1 1 auto;min-width:0;font-weight:600;font-size:13px;line-height:1.4}
.src-doc small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.tag{flex:0 0 auto;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:999px;white-space:nowrap}
.tag.on{color:var(--ok-fg);background:var(--ok-bg)}.tag.off{color:var(--faint)}
.src p{color:var(--muted);font-size:13px;line-height:1.6;margin:8px 0 0}
.rel{display:flex;align-items:center;gap:8px;margin-top:8px;font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.rel div{flex:1;height:3px;border-radius:99px;background:var(--hover);overflow:hidden}
.rel i{display:block;height:100%;background:var(--accent);border-radius:99px}
.why{font-size:13px;color:var(--muted);line-height:1.6;margin:0;padding-left:26px}
.thumbs{display:flex;gap:4px;margin-top:6px}
.thumbs button{background:transparent;border:0;border-radius:8px;padding:5px 7px;color:var(--muted);line-height:0}
.thumbs button:hover{background:var(--hover)}.thumbs button.on{color:var(--accent);background:var(--accent-soft)}
.info{background:var(--warn-bg);border-radius:12px;padding:10px 14px;font-size:14px;margin:6px 0 10px}
.ask{position:sticky;bottom:0;background:linear-gradient(to top,var(--bg) 70%,transparent);padding:12px 24px 18px}
.ask form{max-width:744px;margin:0 auto;display:flex;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:6px 6px 6px 14px}
.ask form:focus-within{border-color:var(--accent)}
.ask input{flex:1;min-width:0;border:0;background:transparent;color:var(--text);font:inherit;font-size:14px;outline:0}
.ask input::placeholder{color:var(--faint)}
.ask button{background:var(--accent);color:var(--on-accent);border:0;border-radius:10px;width:36px;height:36px;line-height:0}
.foot{text-align:center;color:var(--faint);font-size:12px;margin:22px 0 0}
.foot a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (max-width:820px){
 .side{position:fixed;top:0;left:0;bottom:0;z-index:20;transform:translateX(-100%);transition:transform .2s var(--ease);box-shadow:0 0 40px rgba(0,0,0,.25);overflow:auto}
 .side.open{transform:none}.menu{display:inline-flex;align-items:center}
 .col{padding:0 16px 16px}.ask{padding:10px 16px 14px}.examples{grid-template-columns:1fr}.card{padding:16px 16px 10px}.bubble div{max-width:92%}.stat{margin-left:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="notice"><b>Demo with sample data.</b> This page shows how the AuroraStays QnA interface looks and behaves. The questions and answers here are fixed
samples recorded from the app; nothing on this page is answered live.</div>
<div class="app">
  <aside class="side" id="side" aria-label="Question history">
    <div class="brand"><span id="mark"></span><span>AuroraStays <i>QnA</i></span></div>
    <button class="primary" id="new" type="button">+ New question</button>
    <input class="search" id="search" type="search" placeholder="Search questions" aria-label="Search history">
    <div id="history"></div>
    <div class="health"><span></span>Demo page: sample data only</div>
  </aside>
  <main class="main">
    <div class="top">
      <button class="ghost menu" id="menu" type="button" aria-label="Show question history">&#9776;&nbsp; History</button>
      <span></span>
      <button class="ghost" id="theme" type="button">Night mode</button>
    </div>
    <div class="col" id="col"></div>
    <div class="ask"><form id="form"><input id="box" placeholder="Ask about a hotel policy" aria-label="Question" maxlength="300" autocomplete="off">
      <button type="submit" aria-label="Send"><svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button></form></div>
  </main>
</div>
<script>
const logo = (size) => `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 32 32" fill="none" role="img" aria-label="AuroraStays"><rect width="32" height="32" rx="9" fill="var(--accent)"/><path d="M10 24v-8a6 6 0 0 1 12 0v8M13.2 20h5.6" stroke="var(--on-accent)" stroke-width="2.6" stroke-linecap="round"/><path d="M8 10a10.5 10.5 0 0 1 16 0" stroke="var(--on-accent)" stroke-opacity=".55" stroke-width="2" stroke-linecap="round"/></svg>`;
const BOOK = "Booking Terms and Cancellation Policy", ROOM = "Room and Property Information Guide", CONDUCT = "Guest Conduct, Accessibility, Safety, and Resolution Guidelines";
// Fixed samples. The answers, routes and passages were recorded from the real app.
const SAMPLES = [
 {id:"chi", group:"Today", time:"11:54 AM", q:"What is the pet fee at ASH-CHI Loop?", route:"AUTO ANSWER", score:"0.98", secs:"4.7",
  a:"The pet fee at ASH-CHI Loop is $50 per night, with a stay cap of $150 [1].",
  why:["Sources fully cover the question.","Best supporting source similarity 0.77.","1 of 1 sources cited."],
  src:[{doc:BOOK, sec:"AS-01 · Section 5, Property-specific quick reference", cited:true, rel:77,
        text:"Property: ASH-CHI Loop, Chicago IL; Check-in / out: 3:00 PM / 12:00 PM; Parking: Self parking, $42 per night; Pets: $50 per night, $150 stay cap; Breakfast: $22 per person."}]},
 {id:"den", group:"Today", time:"11:59 AM", q:"Can a guest bring two dogs to the Denver hotel?", route:"AUTO ANSWER", score:"1.00", secs:"4.3",
  a:"Yes, a guest can bring two dogs to the Denver hotel. The policy states a maximum of 2 pets per stay [1]. Staff should note that there is a pet fee of $75 per stay [1].",
  why:["Sources fully cover the question.","Best supporting source similarity 0.81.","1 of 2 sources cited."],
  src:[{doc:BOOK, sec:"AS-01 · Section 5, Property-specific quick reference", cited:true, rel:81,
        text:"Property: ASH-DEN Union, Denver CO; Check-in / out: 4:00 PM / 11:00 AM; Parking: Garage, $35 per night; Pets: $75 per stay; 2 pets max; Breakfast: $18 per person."},
       {doc:CONDUCT, sec:"AS-04 · Section 7, Property-specific reminders", cited:false, rel:74,
        text:"Quiet hours, smoking rules, service animal procedures, and complaint handling are group-wide baselines. Parking, breakfast, pet fees, room access, and amenity availability are property-specific unless the guest's confirmation states otherwise."}]},
 {id:"mia", group:"Today", time:"12:16 PM", q:"Is breakfast free at the Miami Brickell property?", route:"AUTO ANSWER", score:"0.98", secs:"4.7",
  a:"No, breakfast is not free at the Miami Brickell property. The cost is $24 per person for breakfast [1].",
  why:["Sources fully cover the question.","Best supporting source similarity 0.79.","1 of 1 sources cited."],
  src:[{doc:BOOK, sec:"AS-01 · Section 5, Property-specific quick reference", cited:true, rel:79,
        text:"Property: ASH-MIA Brickell, Miami FL; Check-in / out: 4:00 PM / 11:00 AM; Parking: Valet, $55 per night; Pets: $100 per stay; 2 pets max; Breakfast: $24 per person."}]},
 {id:"adv", group:"Yesterday", time:"4:20 PM", q:"Can I cancel an Advance Purchase booking for a refund?", route:"AUTO ANSWER", score:"1.00", secs:"5.1",
  a:"Advance Purchase rates are generally non-refundable and cannot be changed [2]. An exception is possible only where the confirmation, the law or an approved service recovery allows it, so staff should not promise a refund and should escalate documented extraordinary circumstances to a manager [1].",
  why:["Sources fully cover the question.","Best supporting source similarity 0.92.","2 of 2 sources cited."],
  src:[{doc:BOOK, sec:"AS-01 · Section 2, Rate plan rules", cited:true, rel:90,
        text:"Rate plan: Advance Purchase; Payment: Full stay charged at booking; Cancel or change: Non-refundable and non-changeable except where the confirmation, law, or an approved service recovery permits an exception.; Staff action: Do not promise a refund. Escalate documented extraordinary circumstances to a manager."},
       {doc:BOOK, sec:"AS-01 · Section 1, Scope and governing rules", cited:true, rel:92,
        text:"Guest-facing summary: Flexible rates can normally be canceled by 6:00 PM local property time one day before arrival without a room charge. Advance Purchase rates are generally non-refundable and cannot be changed. The confirmation controls if it states a different rule."}]},
 {id:"king", group:"Yesterday", time:"2:05 PM", q:"What exactly is included in an Accessible King room?", route:"ASSISTED REVIEW", score:"0.75", secs:"4.9",
  a:"An Accessible King room typically has a King bed with selected accessible features and takes up to 2 adults, subject to property limits [1]. The sources do not list the exact accessible features, so staff should ask the guest which features are needed and check the property profile [1].",
  why:["Sources cover only part of the question.","Best supporting source similarity 0.84.","1 of 1 sources cited."],
  src:[{doc:ROOM, sec:"AS-02 · Section 1, Room types and occupancy", cited:true, rel:84,
        text:"Room type: Accessible King; Typical configuration: King bed with selected accessible features; Typical occupancy: Up to 2 adults, subject to property limits; Important note: Ask which features are needed. An accessible room is not a medical accommodation package."}]},
 {id:"spa", group:"Yesterday", time:"11:59 AM", q:"Does the Chicago Loop property have a spa?", route:"MANUAL LOOKUP", score:"0.41", secs:"3.5",
  a:"The policy documents do not mention spa facilities at ASH-CHI Loop. Staff should check the live property profile or contact the property team for confirmation.",
  why:["Sources do not contain the answer.","Best supporting source similarity 0.71.","Answer cites no source."],
  src:[{doc:BOOK, sec:"AS-01 · Section 5, Property-specific quick reference", cited:false, rel:71,
        text:"Property: ASH-CHI Loop, Chicago IL; Check-in / out: 3:00 PM / 12:00 PM; Parking: Self parking, $42 per night; Pets: $50 per night, $150 stay cap; Breakfast: $22 per person."},
       {doc:CONDUCT, sec:"AS-04 · Section 7, Property-specific reminders", cited:false, rel:66,
        text:"Quiet hours, smoking rules, service animal procedures, and complaint handling are group-wide baselines. Parking, breakfast, pet fees, room access, and amenity availability are property-specific unless the guest's confirmation states otherwise."}]},
];
const ROUTES = {"AUTO ANSWER":["ok","auto","Ready to share with the guest."],"ASSISTED REVIEW":["warn","review","Check the sources before sharing."],"MANUAL LOOKUP":["bad","manual","Look this up with the property team."]};
const $ = (id) => document.getElementById(id);
const esc = (s) => s.replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const cite = (s) => esc(s).replace(/\[(\d)\]/g, '<sup class="cite" title="Source $1">$1</sup>');
const thumb = (up) => `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="transform:${up ? "none" : "rotate(180deg)"}"><path d="M7 11v9H4v-9h3Zm0 0 4-8a2 2 0 0 1 2 2v4h5a2 2 0 0 1 2 2.3l-1.2 6A2 2 0 0 1 16.800 20H7" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
let active = null;

function drawHistory() {
  const needle = $("search").value.trim().toLowerCase();
  const items = SAMPLES.filter((s) => s.q.toLowerCase().includes(needle));
  let html = "", group = "";
  for (const s of items) {
    if (s.group !== group) { group = s.group; html += `<div class="group">${group}</div>`; }
    const kind = ROUTES[s.route][1], word = s.route.split(" ")[0];
    html += `<button class="row ${kind}${s.id === active ? " on" : ""}" data-id="${s.id}" type="button"><span class="dot"></span><span class="q">${esc(s.q)}</span>
      <span class="t">${s.time} · ${word[0] + word.slice(1).toLowerCase()}</span></button>`;
  }
  $("history").innerHTML = html || `<p class="none">No saved question matches.</p>`;
}

function drawHome() {
  active = null;
  $("col").innerHTML = `<div class="hero">${logo(44)}<h1>What would you like to know?</h1>
    <p>Ask a guest-policy question in plain words. Answers come only from the AuroraStay policy documents, with the sources shown.</p></div>
    <div class="try">Try asking</div><div class="examples">${SAMPLES.map((s) => `<button type="button" data-id="${s.id}">${esc(s.q)}</button>`).join("")}</div>
    <p class="foot">This page is a static demo. The working app and its code are in the
    <a href="https://github.com/asynckumar/aurora-stay-qna">aurora-stay-qna repository</a>.</p>`;
  drawHistory();
}

function drawAnswer(s) {
  active = s.id;
  const [cls, , hint] = ROUTES[s.route];
  const cited = s.src.filter((x) => x.cited).length;
  const sources = s.src.map((x, i) => `<div class="src"><div class="src-h"><span class="src-n">${i + 1}</span>
      <span class="src-doc">${esc(x.doc)}<small>${esc(x.sec)}</small></span><span class="tag ${x.cited ? "on" : "off"}">${x.cited ? "Cited" : "Not cited"}</span></div>
      <p>${esc(x.text)}</p><div class="rel"><span>Relevance</span><div><i style="width:${x.rel}%"></i></div><span>${x.rel}%</span></div></div>`).join("");
  const word = s.route[0] + s.route.slice(1).toLowerCase();
  $("col").innerHTML = `<div class="bubble"><div>${esc(s.q)}</div><span>${s.time}</span></div>
    <div class="card"><div class="meta"><span class="pill ${cls}">${s.route}</span><span class="hint">${hint}</span><span class="stat">${s.secs} s · sample</span></div>
    <p class="answer">${cite(s.a)}</p>
    <details><summary>Sources · ${s.src.length}${cited ? " · " + cited + " cited" : ""}</summary>${sources}</details>
    <details><summary>Why ${word} · score ${s.score}</summary><ul class="why">${s.why.map((w) => `<li>${esc(w)}</li>`).join("")}</ul></details>
    <div class="thumbs"><button type="button" aria-label="Helpful">${thumb(true)}</button><button type="button" aria-label="Not helpful">${thumb(false)}</button></div></div>`;
  drawHistory();
  $("side").classList.remove("open");
  window.scrollTo({top: 0});
}

function ask(text) {
  const words = text.toLowerCase().match(/[a-z]{3,}/g) || [];
  let best = null, top = 0;
  for (const s of SAMPLES) {
    const hay = s.q.toLowerCase(), hits = words.filter((w) => hay.includes(w)).length;
    if (hits > top) { top = hits; best = s; }
  }
  if (best && top >= 3) return drawAnswer(best);
  active = null;
  $("col").innerHTML = `<div class="bubble"><div>${esc(text)}</div><span>just now</span></div>
    <div class="info"><b>This demo cannot answer new questions.</b> It only holds six recorded examples. Pick one from the history on the left
    or from the start screen to see a full answer with its sources and route.</div>`;
  drawHistory();
}

document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-id]");
  if (b) return drawAnswer(SAMPLES.find((s) => s.id === b.dataset.id));
  const t = e.target.closest(".thumbs button");
  if (t) { t.parentElement.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === t && !t.classList.contains("on"))); }
});
$("new").onclick = () => { drawHome(); $("side").classList.remove("open"); };
$("search").oninput = drawHistory;
$("menu").onclick = () => $("side").classList.toggle("open");
$("theme").onclick = () => {
  const dark = document.documentElement.dataset.theme !== "dark";
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  $("theme").textContent = dark ? "Day mode" : "Night mode";
};
$("form").onsubmit = (e) => { e.preventDefault(); const v = $("box").value.trim(); if (v) { ask(v); $("box").value = ""; } };
$("mark").innerHTML = logo(26);
drawHome();
</script>
</body>
</html>
