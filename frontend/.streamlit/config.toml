[server]
headless = true
runOnSave = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

[theme]
base = "light"
font = "Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
codeFont = "'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
baseRadius = "0.6rem"

[theme.light]
primaryColor = "#287A5B"
backgroundColor = "#F7F8F7"
secondaryBackgroundColor = "#F0F2F0"
textColor = "#202722"

[theme.dark]
primaryColor = "#72BD96"
backgroundColor = "#111512"
secondaryBackgroundColor = "#202823"
textColor = "#EEF2EE"
